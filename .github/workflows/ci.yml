name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm -r test

  database:
    name: Migrations, RLS, hash chain
    runs-on: ubuntu-latest

    # A real Postgres with real PostGIS. The RLS suite switches to the
    # `authenticated` role and relies on genuine policy evaluation — mocking any
    # part of this would only test the mock (ADR-0014).
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: habba_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: habba_dev
      HABBA_PGPORT: 54329

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # The postgis/postgis image pre-installs PostGIS into `public`, but every
      # geography column and every SECURITY DEFINER function here qualifies
      # `extensions.*` (search_path is empty — ADR-0003). PostGIS cannot be
      # relocated after the fact, so the extension is dropped and 0001 installs
      # it where it belongs. 0001 refuses to continue if this is skipped.
      - name: Put PostGIS in the extensions schema
        run: psql -v ON_ERROR_STOP=1 -c "drop extension if exists postgis cascade"

      - name: Apply shim and migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/scripts/supabase_shim.sql
          for migration in supabase/migrations/*.sql; do
            echo "  $(basename "$migration")"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          for seed in supabase/seed/*.sql; do
            echo "  $(basename "$seed")"
            psql -v ON_ERROR_STOP=1 -f "$seed"
          done

      - name: Schema, timeline, tamper and RLS suites
        run: |
          for suite in supabase/tests/*.sql; do
            echo "── $(basename "$suite")"
            psql -v ON_ERROR_STOP=1 -f "$suite"
          done

      - name: Hash chain under concurrency
        run: ./supabase/scripts/concurrency-test.sh

      - name: Slot booking under concurrency
        run: ./supabase/scripts/slot-concurrency-test.sh

      # The seam. Everything above proves the schema; the app's unit tests
      # prove the client. Only this proves they work together — app code
      # through supabase-js, over HTTP, through a real JWT, through RLS.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install PostgREST
        run: |
          curl -fsSL -o postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v16.2/postgrest-v16.2-linux-static-x86-64.tar.xz
          tar -xJf postgrest.tar.xz
          sudo mv postgrest /usr/local/bin/

      - name: Start PostgREST
        run: ./supabase/scripts/postgrest.sh start

      - name: Integration tests (app → PostgREST → RLS)
        # Fail rather than skip if the harness is down — a skipped integration
        # suite is a green build that proved nothing.
        env:
          HABBA_REQUIRE_HARNESS: '1'
        run: pnpm --filter @habba/mobile exec vitest run src/features

      - name: RLS suite (raw HTTP, real JWT)
        env:
          HABBA_REQUIRE_HARNESS: '1'
        run: pnpm test:rls

      # The same 17 assertions in HOSTED mode, behind a gateway that routes
      # /rest/v1 and demands an apikey the way Supabase's does. Catches the URL
      # and header defects that otherwise only surface against a live project —
      # which is how they were found the first time.
      - name: RLS suite (hosted request shape)
        run: pnpm test:rls:hosted-shape
