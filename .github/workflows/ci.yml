name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm -r test

      # The gap every other step in this job leaves open. Typecheck resolves
      # types, lint reads syntax, and the unit tests only ever load pure
      # modules — none of them ever asks Metro to build the app. A missing
      # native dependency, an unresolvable import or a broken asset therefore
      # passes all of them and fails on the first device that opens the app.
      # `expo export` is the cheapest thing that actually bundles.
      - name: Bundle both apps
        run: pnpm bundle

  preview-build:
    name: Preview build (EAS)
    runs-on: ubuntu-latest
    needs: static

    # Only on the default branch, and only once an Expo token exists. Without
    # the secret this job is skipped rather than failed: a red pipeline that
    # means "you have not signed up for EAS yet" trains people to ignore red.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Check for an Expo token
        id: token
        run: echo "present=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.present == 'true'

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # An installable build of the app, which is the only way to see it as its
      # users will: Expo Go cannot apply config plugins, and `forcesRTL` in
      # app.json is one — so RTL behaves differently there than it does in
      # anything shipped. See CONTRIBUTING.md.
      - name: Build mobile preview
        if: steps.token.outputs.present == 'true'
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait

  database:
    name: Migrations, RLS, hash chain
    runs-on: ubuntu-latest

    # A real Postgres with real PostGIS. The RLS suite switches to the
    # `authenticated` role and relies on genuine policy evaluation — mocking any
    # part of this would only test the mock (ADR-0014).
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: habba_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: habba_dev
      HABBA_PGPORT: 54329

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ONE definition of "apply the database", shared with `pnpm db:test`.
      #
      # This job used to carry its own copy of the loop, and the copy drifted:
      # it applied migrations as the superuser — so the hosted-privilege
      # harness in supabase_shim.sql was bypassed here, in the very place meant
      # to catch a migration that a real project would refuse — and it never
      # applied supabase/storage/*.sql, so the triage-media policies were
      # missing and suite 24 failed. Calling the script removes the copy.
      #
      # HABBA_PG_EXTERNAL keeps it away from the cluster: the service container
      # above is not ours to start or stop. It still drops and recreates the
      # database, which is also how the postgis/postgis image's pre-loaded
      # PostGIS (in `public`) goes away — the shim then installs it into
      # `extensions`, where every SECURITY DEFINER function expects it under an
      # empty search_path (ADR-0003).
      - name: Apply shim, migrations, storage policies and seed
        env:
          HABBA_PG_EXTERNAL: '1'
        run: ./supabase/scripts/local-db.sh create && ./supabase/scripts/local-db.sh migrate

      - name: Schema, timeline, tamper and RLS suites
        run: |
          for suite in supabase/tests/*.sql; do
            echo "── $(basename "$suite")"
            psql -v ON_ERROR_STOP=1 -f "$suite"
          done

      - name: Hash chain under concurrency
        run: ./supabase/scripts/concurrency-test.sh

      - name: Slot booking under concurrency
        run: ./supabase/scripts/slot-concurrency-test.sh

      # The seam. Everything above proves the schema; the app's unit tests
      # prove the client. Only this proves they work together — app code
      # through supabase-js, over HTTP, through a real JWT, through RLS.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install PostgREST
        run: |
          curl -fsSL -o postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v16.2/postgrest-v16.2-linux-static-x86-64.tar.xz
          tar -xJf postgrest.tar.xz
          sudo mv postgrest /usr/local/bin/

      - name: Start PostgREST
        run: ./supabase/scripts/postgrest.sh start

      - name: Integration tests (app → PostgREST → RLS)
        # Fail rather than skip if the harness is down — a skipped integration
        # suite is a green build that proved nothing.
        env:
          HABBA_REQUIRE_HARNESS: '1'
        run: pnpm --filter @habba/mobile exec vitest run src/features

      - name: RLS suite (raw HTTP, real JWT)
        env:
          HABBA_REQUIRE_HARNESS: '1'
        run: pnpm test:rls

      # The same 17 assertions in HOSTED mode, behind a gateway that routes
      # /rest/v1 and demands an apikey the way Supabase's does. Catches the URL
      # and header defects that otherwise only surface against a live project —
      # which is how they were found the first time.
      - name: RLS suite (hosted request shape)
        run: pnpm test:rls:hosted-shape
